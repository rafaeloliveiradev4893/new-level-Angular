<div class="profile-content" [class.compact]="compact">
  @if (auth.isLoading$ | async) {
    <div class="loading">Carregando...</div>
  } @else {
    @if ((auth.isAuthenticated$ | async) && (auth.user$ | async); as user) {
      <div class="profile-container">
        @if (user.picture) {
          <img [src]="user.picture" [alt]="user.name || 'Foto de perfil'" class="profile-image" />
        }
        <div class="profile-info">
          <span class="profile-name">{{ user.name || user.nickname || 'Usuário' }}</span>
          @if (user.email) {
            <span class="profile-email">{{ user.email }}</span>
          }
        </div>
        <app-logout-button/>
      </div>
    } @else {
      <app-auth-button/>
    }
  }
</div>
