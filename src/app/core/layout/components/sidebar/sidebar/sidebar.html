<div class="sidebar-shell">
  @if (!isMobileOpen) {
    <button
      class="mobile-menu-toggle"
      type="button"
      aria-label="Abrir menu"
      aria-controls="app-sidebar"
      [attr.aria-expanded]="isMobileOpen"
      (click)="toggleMobileMenu()"
    >
      <ng-icon name="lucideMenu" size="24px" />
    </button>
  }

  @if (isMobileOpen) {
    <button
      class="sidebar-backdrop"
      type="button"
      aria-label="Fechar menu"
      (click)="closeMobileMenu()"
    ></button>
  }

  <aside
    id="app-sidebar"
    class="sidebar"
    [class.collapsed]="isCollapsed"
    [class.mobile-open]="isMobileOpen"
    (keydown.escape)="closeMobileMenu()"
  >
    <div class="sidebar-content">
      <div class="sidebar-header">
        <a class="logo" routerLink="/" aria-label="New Level - Visão Geral" (click)="closeMobileMenu()">
          <img src="logo.svg" alt="">
          <span>New Level</span>
        </a>
        <button
          class="collapse-toggle"
          type="button"
          [attr.aria-label]="isCollapsed ? 'Expandir menu' : 'Recolher menu'"
          [attr.aria-expanded]="!isCollapsed"
          (click)="toggleCollapsed()"
        >
          <ng-icon [name]="isCollapsed ? 'lucideChevronRight' : 'lucideChevronLeft'" size="20px" />
        </button>
        <button
          class="mobile-close-toggle"
          type="button"
          aria-label="Fechar menu"
          (click)="closeMobileMenu()"
        >
          <ng-icon name="lucideX" size="24px" />
        </button>
      </div>

      <span class="menu-txt">Menu</span>
      <nav class="menu-navegacao" aria-label="Navegação principal">
        <app-navegation-button route="/" label="Visão Geral" [collapsed]="isCollapsed" (selected)="closeMobileMenu()">
          <ng-icon name="lucideLayoutDashboard" size="24px" />
          <span>Visão Geral</span>
        </app-navegation-button>

        <app-navegation-button route="/Estatisticas" label="Estatísticas" [collapsed]="isCollapsed" (selected)="closeMobileMenu()">
          <ng-icon name="lucideChartNoAxesColumnIncreasing" size="24px" />
          <span>Estatísticas</span>
        </app-navegation-button>

        <app-navegation-button route="/Tarefas" label="Tarefas" [collapsed]="isCollapsed" (selected)="closeMobileMenu()">
          <ng-icon name="lucideListChecks" size="24px" />
          <span>Tarefas</span>
        </app-navegation-button>

        <app-navegation-button route="/Eventos" label="Eventos" [collapsed]="isCollapsed" (selected)="closeMobileMenu()">
          <ng-icon name="lucideCalendarDays" size="24px" />
          <span>Eventos</span>
        </app-navegation-button>

        <app-navegation-button route="/Guilda" label="Guilda" [collapsed]="isCollapsed" (selected)="closeMobileMenu()">
          <ng-icon name="lucideShield" size="24px" />
          <span>Guilda</span>
        </app-navegation-button>

        <app-navegation-button route="/NPCs" label="NPCs" [collapsed]="isCollapsed" (selected)="closeMobileMenu()">
          <ng-icon name="lucideUserRound" size="24px" />
          <span>NPCs</span>
        </app-navegation-button>

        <app-navegation-button route="/Conquistas" label="Conquistas" [collapsed]="isCollapsed" (selected)="closeMobileMenu()">
          <ng-icon name="lucideTrophy" size="24px" />
          <span>Conquistas</span>
        </app-navegation-button>

        <app-navegation-button route="/Loja" label="Loja" [collapsed]="isCollapsed" (selected)="closeMobileMenu()">
          <ng-icon name="lucideStore" size="24px" />
          <span>Loja</span>
        </app-navegation-button>

        <app-navegation-button route="/Amigos" label="Amigos" [collapsed]="isCollapsed" (selected)="closeMobileMenu()">
          <ng-icon name="lucideUsers" size="24px" />
          <span>Amigos</span>
        </app-navegation-button>
      </nav>

      <div class="menu-config">
        <app-profile-button [compact]="isCollapsed" />
      </div>
    </div>
  </aside>
</div>
