@if (auth.isLoading$ | async) {
  <span>Loading...</span>
} @else {
  @if ((auth.isAuthenticated$ | async) && (auth.user$ | async); as user) {

    <p>{{ userInf.name }}</p>
    <p>Level: {{ userInf.level }}</p>

  } @else {

    @if (auth.error$ | async; as error) {
    <p>Error: {{ error.message }}</p>
    }

    <button (click)="auth.loginWithRedirect({ authorizationParams: { screen_hint: 'signup' } })" class="signup-button">
      Entrar
    </button>
    <button (click)="auth.loginWithRedirect()" class="sign-in-button">Cadastrar-se</button>

    }
}
