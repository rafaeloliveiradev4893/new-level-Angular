@if (auth.isLoading$ | async) {
  <span>Carregando...</span>
} @else {
  @if ((auth.isAuthenticated$ | async) && (auth.user$ | async)) {
    @if (userInf) {
      <div class="info">
        <span>{{ userInf.name }}, </span>
        <span>LV: {{ userInf.level }}</span>
      </div>
    }

  } @else {
    <button type="button" (click)="auth.loginWithRedirect()" class="sign-in-button">
      Entrar
    </button>
    <button
      type="button"
      (click)="auth.loginWithRedirect({ authorizationParams: { screen_hint: 'signup' } })"
      class="signup-button"
    >
      Criar conta
    </button>
  }
}
