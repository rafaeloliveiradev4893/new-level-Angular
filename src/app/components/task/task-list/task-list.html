<div class="task-list-container" (window:keydown.escape)="closeTaskForm()">
  <h2>Minhas Tarefas</h2>

  @if (error() && !taskFormOpen()) {
    <div class="error">{{ error() }}</div>
  }

  @if (loading() && tasks().length === 0) {
    <div class="loading">Carregando...</div>
  } @else {
    <div class="task-list">
      @for (task of tasks(); track task.id) {
        <app-task-card
          [task]="task"
          (completionToggled)="toggleComplete($event)"
          (deletionRequested)="deleteTask($event)"
        />
      } @empty {
        <p class="empty">Nenhuma tarefa adicionada</p>
      }
    </div>
  }
  <button class="open-form-button" type="button" (click)="openTaskForm()">
    <span>Adicionar tarefa</span> <ng-icon name="lucidePlus" size="24px"></ng-icon>
  </button>

  @if (taskFormOpen()) {
    <div
      class="modal-backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="task-form-title"
      tabindex="-1"
      (click)="closeTaskForm()"
    >
      <section class="task-modal" (click)="$event.stopPropagation()">
        <div class="modal-heading">
          <h2 id="task-form-title">Adicionar tarefa</h2>
          <button
            class="close-modal-button"
            type="button"
            aria-label="Fechar formulário"
            (click)="closeTaskForm()"
          >
            &times;
          </button>
        </div>

        @if (error()) {
          <div class="error" role="alert">{{ error() }}</div>
        }

        <form (ngSubmit)="addTask()" class="task-form">
          <input
            type="text"
            [(ngModel)]="newTask().title"
            name="title"
            placeholder="Título da tarefa"
            required
          />
          <input
            type="text"
            [(ngModel)]="newTask().description"
            name="description"
            placeholder="Descrição (opcional)"
          />
          <select [(ngModel)]="newTask().category" name="category">
            @for (cat of categories; track cat) {
              <option [value]="cat">{{ cat }}</option>
            }
          </select>
          <select [(ngModel)]="newTask().difficulty" name="difficulty">
            @for (diff of difficulties; track diff) {
              <option [value]="diff">{{ diff }}</option>
            }
          </select>
          <button type="submit" [disabled]="loading()">Adicionar</button>
        </form>
      </section>
    </div>
  }
</div>
