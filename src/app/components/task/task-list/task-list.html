<div class="task-list-container">
  <h2>Minhas Tarefas</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form (ngSubmit)="addTask()" class="task-form">
    <input
      type="text"
      [(ngModel)]="newTask().title"
      name="title"
      placeholder="Título da tarefa"
      required
    />
    <input
      type="text"
      [(ngModel)]="newTask().description"
      name="description"
      placeholder="Descrição (opcional)"
    />
    <select [(ngModel)]="newTask().category" name="category">
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>
    <select [(ngModel)]="newTask().difficulty" name="difficulty">
      @for (diff of difficulties; track diff) {
        <option [value]="diff">{{ diff }}</option>
      }
    </select>
    <button type="submit" [disabled]="loading()">Adicionar</button>
  </form>

  @if (loading() && tasks().length === 0) {
    <div class="loading">Carregando...</div>
  } @else {
    <div class="task-list">
      @for (task of tasks(); track task.id) {
        <app-task-card
          [task]="task"
          (completionToggled)="toggleComplete($event)"
          (deletionRequested)="deleteTask($event)"
        />
      } @empty {
        <p class="empty">Nenhuma tarefa encontrada</p>
      }
    </div>
  }
</div>
